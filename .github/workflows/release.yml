# FILE: .github/workflows/release.yml
# PURPOSE: Сборка Windows / Linux / macOS и публикация в GitHub Release.
name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий или новый тег релиза (например v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            slug: windows-x64
            ext: .exe
          - os: ubuntu-22.04
            slug: linux-x64
            ext: ""
          - os: macos-13
            slug: macos-x64
            ext: ""
          - os: macos-14
            slug: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgtk-3-dev libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            pip install pyobjc-framework-Cocoa pyobjc-framework-Quartz
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-exe.ps1
          Copy-Item dist\CursorLimits.exe "dist\CursorLimits-${{ matrix.slug }}.exe"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          SLUG="${{ matrix.slug }}"
          if [[ -d dist/CursorLimits.app ]]; then
            (cd dist && zip -r "CursorLimits-${SLUG}.app.zip" CursorLimits.app)
          elif [[ -f dist/CursorLimits ]]; then
            cp dist/CursorLimits "dist/CursorLimits-${SLUG}"
            chmod +x "dist/CursorLimits-${SLUG}"
          else
            echo "No binary produced" >&2
            ls -la dist || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-limits-${{ matrix.slug }}
          path: |
            dist/CursorLimits-${{ matrix.slug }}*
          if-no-files-found: error

  publish:
    needs: build
    # Публикуем даже если одна платформа упала — заливаются удачные артефакты
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f -print

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          NOTES="## Cursor Limits ${TAG}

          Кроссплатформенные сборки / Cross-platform builds.

          | Platform | File |
          |----------|------|
          | Windows x64 | \`CursorLimits-windows-x64.exe\` |
          | Linux x64 | \`CursorLimits-linux-x64\` |
          | macOS Intel | \`CursorLimits-macos-x64.app.zip\` (или binary) |
          | macOS Apple Silicon | \`CursorLimits-macos-arm64.app.zip\` (или binary) |

          ### Требования / Requirements
          - Залогиненный Cursor IDE на этой машине
          - Лицензия: PolyForm Noncommercial 1.0.0

          ### Примечания
          - Windows SmartScreen / macOS Gatekeeper могут предупреждать (бинарник не подписан).
          - Linux: нужен трей (AppIndicator / StatusNotifier) и графическая сессия.
          "

          shopt -s nullglob
          FILES=(release-assets/CursorLimits-*)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No assets found" >&2
            ls -laR release-assets || true
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.sha }}" \
              --title "Cursor Limits $TAG" \
              --notes "$NOTES" \
              --latest
          fi
